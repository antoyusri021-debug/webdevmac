<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dock Monitoring Musik OBS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #141720;
      --line: rgba(255, 255, 255, .09);
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --red: #ff5964;
      --gold: #fbbf24;
      --green: #22c55e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      padding: 16px;
      background: radial-gradient(ellipse at 50% -15%, rgba(239, 68, 68, .15), transparent 45%), var(--bg);
    }

    .dock {
      width: min(100%, 520px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 1px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, #ff5964, #991b1b);
      font-size: 17px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #737b89;
    }

    .dot.on {
      background: var(--green);
      box-shadow: 0 0 9px var(--green);
    }

    .notice {
      display: none;
      padding: 9px 11px;
      border: 1px solid rgba(248, 113, 113, .25);
      border-radius: 9px;
      background: rgba(127, 29, 29, .25);
      color: #fecaca;
      font-size: 11px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(20, 23, 32, .96);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .2);
    }

    .now { padding: 15px; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff9299;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .song-main {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 13px;
      min-width: 0;
    }

    .cover {
      width: 66px;
      height: 66px;
      flex: 0 0 66px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(145deg, #33171b, #20232d);
      color: #ff8b93;
      font-size: 23px;
    }

    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .meta { min-width: 0; flex: 1; }

    .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 820;
      letter-spacing: -.025em;
    }

    .byline {
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      margin-top: 0;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .045);
      color: #d8deea;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
    }

    .status.playing {
      border-color: rgba(34, 197, 94, .25);
      background: rgba(34, 197, 94, .09);
      color: #86efac;
    }

    .vip-pill {
      display: inline-flex;
      padding: 4px 8px;
      border: 1px solid rgba(251, 191, 36, .28);
      border-radius: 20px;
      background: rgba(251, 191, 36, .1);
      color: #fcd34d;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .vip-pill[hidden] { display: none; }

    .dock-controls { display: flex; gap: 8px; margin-top: 13px; }
    .dock-button {
      flex: 1; min-height: 36px; border: 1px solid var(--line); border-radius: 9px;
      background: rgba(255,255,255,.06); color: var(--text); font: inherit;
      font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .dock-button.primary { border-color: rgba(255,89,100,.35); background: rgba(255,89,100,.16); color: #ffb1b6; }
    .dock-button:disabled { opacity: .45; cursor: not-allowed; }

    .battle { padding: 13px 14px; }

    .battle-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .battle-status {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .05);
      color: #cbd5e1;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .battle-status.on {
      border-color: rgba(34, 197, 94, .35);
      background: rgba(34, 197, 94, .12);
      color: #86efac;
    }

    .battle-status.waiting {
      border-color: rgba(251, 191, 36, .3);
      background: rgba(251, 191, 36, .1);
      color: #fde68a;
    }

    .battle-status.off { color: var(--muted); }

    .battle-summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .battle-leaderline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid rgba(251, 191, 36, .19);
      border-radius: 9px;
      background: rgba(251, 191, 36, .055);
    }

    .battle-leaderline[hidden] { display: none; }

    .battle-leader-name {
      overflow: hidden;
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .battle-leader-coins {
      flex: 0 0 auto;
      color: #fcd34d;
      font-size: 12px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .battle-board { display: grid; margin-top: 5px; }

    .battle-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px 2px;
      border-top: 1px solid var(--line);
      font-size: 10px;
    }

    .battle-rank { color: var(--muted); font-weight: 850; }
    .battle-user { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .battle-user small { margin-left: 5px; color: var(--muted); font-size: 9px; }
    .battle-coins { color: #fcd34d; font-weight: 850; font-variant-numeric: tabular-nums; }
    .battle-empty { color: var(--muted); font-size: 10px; }

    .queue { padding: 0 14px 8px; }

    .queue-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 1px 11px;
    }

    .queue-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 850;
    }

    .queue-count { color: var(--muted); font-size: 10px; }
    .items { display: grid; }

    .item {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 11px 2px;
      border-top: 1px solid var(--line);
      cursor: grab;
    }
    .item.dragging { opacity: .45; }
    .item.drop-target { background: rgba(255,255,255,.045); }
    .item-actions { display: flex; align-items: center; gap: 7px; }
    .play-song {
      padding: 6px 8px; border: 1px solid rgba(255,89,100,.28); border-radius: 7px;
      background: rgba(255,89,100,.12); color: #ffb1b6; font: inherit;
      font-size: 10px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .drag-handle { color: var(--muted); font-size: 12px; user-select: none; }

    .num {
      color: #ff9299;
      font-size: 11px;
      font-weight: 850;
      text-align: center;
    }

    .song { min-width: 0; }

    .item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .requester {
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vvip {
      color: var(--gold);
      font-size: 9px;
      font-weight: 850;
    }

    .empty {
      padding: 17px 4px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 380px) {
      body { padding: 10px; }
      .title { font-size: 15px; }
      .cover { width: 56px; height: 56px; flex-basis: 56px; }
    }
  </style>
</head>
<body>
  <main class="dock">
    <header>
      <div class="brand"><span class="brand-icon">♫</span><span>Music Monitor</span></div>
      <div class="connection">
        <span class="dot" id="connection-dot"></span>
        <span id="connection-text">Menghubungkan</span>
      </div>
    </header>

    <div class="notice" id="notice">Menghubungkan ke server pemutar musik…</div>

    <section class="card now">
      <div class="section-label"><span>♫</span> Sedang diputar</div>
      <div class="song-main">
        <div class="cover" id="cover">♫</div>
        <div class="meta">
          <div class="title" id="current-title">Menunggu lagu…</div>
          <div class="byline" id="current-by">Peminta: —</div>
          <div class="status-row">
            <span class="status" id="play-state">STANDBY</span>
            <span class="vip-pill" id="current-vvip-badge" hidden>VVIP</span>
          </div>
        </div>
      </div>
      <div class="dock-controls">
        <button class="dock-button primary" id="pause-play-btn" type="button" disabled>⏸ Pause</button>
        <button class="dock-button" id="next-song-btn" type="button">⏭ Lagu berikutnya</button>
      </div>
    </section>

    <section class="card battle" aria-label="Battle Fasttrack">
      <div class="battle-head">
        <div class="queue-name"><span>⚔</span> Battle Fasttrack</div>
        <span class="battle-status off" id="battle-status">MENUNGGU</span>
      </div>
      <div class="battle-summary" id="battle-summary">Memuat status battle…</div>
      <div class="battle-leaderline" id="battle-leaderline" hidden></div>
      <div class="battle-board" id="battle-board"></div>
    </section>

    <section class="card queue">
      <div class="queue-head">
        <div class="queue-name"><span>☷</span> Antrean lagu</div>
        <span class="queue-count" id="queue-count">0 lagu</span>
      </div>
      <div class="items" id="queue-items">
        <div class="empty">Antrean lagu akan muncul di sini.</div>
      </div>
    </section>
  </main>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const safe = value => String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));

      const render = data => {
        data = data || {};
        const current = data.currentSong || null;
        const queue = Array.isArray(data.songQueue) ? data.songQueue : [];
        const isPlaying = data.isPlaying !== false;
        const pauseButton = $('pause-play-btn');
        pauseButton.disabled = !current;
        pauseButton.textContent = isPlaying ? '⏸ Pause' : '▶ Lanjutkan';
        pauseButton.dataset.action = isPlaying ? 'pause' : 'play';

        $('current-title').textContent = current?.title || 'Menunggu lagu…';
        $('current-by').textContent = current ? `Peminta: ${current.requestedBy || 'HOST'}` : 'Peminta: —';
        $('play-state').textContent = !current ? 'STANDBY' : isPlaying ? 'SEDANG DIPUTAR' : 'PAUSE';
        $('play-state').classList.toggle('playing', Boolean(current && isPlaying));
        $('current-vvip-badge').hidden = current?.vvip !== true;
        $('cover').innerHTML = current?.youtubeId
          ? `<img alt="Sampul lagu" src="https://img.youtube.com/vi/${encodeURIComponent(current.youtubeId)}/hqdefault.jpg">`
          : '♫';

        $('queue-count').textContent = `${queue.length} lagu`;
        $('queue-items').innerHTML = queue.length
          ? queue.map((song, index) => `
              <div class="item" draggable="true" data-index="${index}" data-id="${safe(song.id)}" title="Seret untuk mengubah urutan">
                <span class="num">${index + 1}</span>
                <div class="song">
                  <div class="item-title">${safe(song.title || 'Judul tidak tersedia')}</div>
                  <div class="requester">${safe(song.requestedBy || 'HOST')}</div>
                </div>
                <div class="item-actions">
                  ${song.vvip === true ? '<span class="vvip" title="Request VVIP">VVIP</span>' : ''}
                  <button class="play-song" type="button" data-play-id="${safe(song.id)}">▶ Putar</button>
                  <span class="drag-handle" aria-hidden="true">⋮⋮</span>
                </div>
              </div>`).join('')
          : '<div class="empty">Antrean kosong.</div>';
      };

      const renderFasttrack = state => {
        if (!state || typeof state !== 'object') return;
        const status = $('battle-status');
        const summary = $('battle-summary');
        const leaderline = $('battle-leaderline');
        const board = $('battle-board');
        const leaderboard = Array.isArray(state.leaderboard) ? state.leaderboard : [];
        const ranked = leaderboard
          .filter(user => Number(user.coins) > 0)
          .sort((a, b) => Number(b.coins || 0) - Number(a.coins || 0));
        const leader = state.leader || ranked[0] || null;

        status.className = 'battle-status';
        leaderline.hidden = true;
        leaderline.innerHTML = '';
        board.innerHTML = '';

        if (state.enabled !== true) {
          status.classList.add('off');
          status.textContent = 'NONAKTIF';
          summary.textContent = 'Battle Fasttrack belum dinyalakan dari media player.';
          board.innerHTML = '<div class="battle-empty">Skor ronde belum berjalan.</div>';
          return;
        }

        if (state.active === true) {
          status.classList.add('on');
          status.textContent = `RONDE ${Number(state.round) || 1} BERJALAN`;
          summary.textContent = state.currentSongTitle
            ? `Battle berlangsung selama lagu “${state.currentSongTitle}” diputar.`
            : 'Battle sedang berlangsung.';
        } else {
          status.classList.add('waiting');
          status.textContent = 'MENUNGGU LAGU';
          summary.textContent = 'Mode aktif; ronde dimulai saat lagu berikutnya berjalan.';
        }

        if (leader && Number(leader.coins) > 0) {
          const name = leader.nickname || leader.username || 'Penonton';
          leaderline.hidden = false;
          leaderline.innerHTML = `<span class="battle-leader-name">♛ @${safe(name)}</span><strong class="battle-leader-coins">${Number(leader.coins).toLocaleString('id-ID')} coin</strong>`;
        } else {
          board.innerHTML = '<div class="battle-empty">Belum ada gift yang dihitung pada ronde ini.</div>';
          return;
        }

        board.innerHTML = ranked.slice(0, 3).map((user, index) => `
          <div class="battle-row">
            <span class="battle-rank">#${index + 1}</span>
            <span class="battle-user">@${safe(user.nickname || user.username || 'Penonton')}<small>${Number(user.queuedSongs) || 0} lagu</small></span>
            <strong class="battle-coins">${Number(user.coins || 0).toLocaleString('id-ID')}</strong>
          </div>`).join('');
      };

      if (typeof io !== 'function') {
        $('notice').style.display = 'block';
        $('notice').textContent = 'Socket.IO tidak ditemukan. Pastikan server pemutar berjalan.';
        $('connection-text').textContent = 'Offline';
      } else {
        const socket = io('http://localhost:3000');
        socket.on('connect', () => {
          $('connection-dot').classList.add('on');
          $('connection-text').textContent = 'Terhubung';
          $('notice').style.display = 'none';
        });
        socket.on('disconnect', () => {
          $('connection-dot').classList.remove('on');
          $('connection-text').textContent = 'Terputus';
          $('notice').style.display = 'block';
          $('notice').textContent = 'Koneksi ke pemutar terputus…';
        });
        socket.on('connect_error', () => {
          $('connection-dot').classList.remove('on');
          $('connection-text').textContent = 'Offline';
          $('notice').style.display = 'block';
          $('notice').textContent = 'Menghubungkan ke server pemutar musik…';
        });
        socket.on('update-queue', data => { window.__dockQueue = Array.isArray(data?.songQueue) ? data.songQueue : []; render(data); });
        socket.on('fasttrack:state', renderFasttrack);

        $('pause-play-btn').addEventListener('click', () => {
          const button = $('pause-play-btn');
          const action = button.dataset.action;
          if (!action) return;
          socket.emit('kontrol-musik', action);
          // Ubah langsung agar tombol dapat ditekan lagi tanpa refresh.
          const isNowPaused = action === 'pause';
          button.dataset.action = isNowPaused ? 'play' : 'pause';
          button.textContent = isNowPaused ? '▶ Lanjutkan' : '⏸ Pause';
        });
        $('next-song-btn').addEventListener('click', () => socket.emit('next-song-manual'));
        $('queue-items').addEventListener('click', event => {
          const button = event.target.closest('[data-play-id]');
          const songId = button?.dataset.playId;
          if (songId && /^\d+$/.test(songId)) socket.emit('play-request-song', Number(songId));
        });

        let draggedIndex = null;
        $('queue-items').addEventListener('dragstart', event => {
          const item = event.target.closest('.item[draggable="true"]');
          if (!item) return;
          draggedIndex = Number(item.dataset.index);
          item.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(draggedIndex));
        });
        $('queue-items').addEventListener('dragover', event => {
          const item = event.target.closest('.item[draggable="true"]');
          if (!item) return;
          event.preventDefault();
          item.classList.add('drop-target');
        });
        $('queue-items').addEventListener('dragleave', event => {
          const item = event.target.closest('.item');
          if (item && !item.contains(event.relatedTarget)) item.classList.remove('drop-target');
        });
        $('queue-items').addEventListener('drop', event => {
          const item = event.target.closest('.item[draggable="true"]');
          if (!item) return;
          event.preventDefault();
          const from = Number(event.dataTransfer.getData('text/plain'));
          const to = Number(item.dataset.index);
          item.classList.remove('drop-target');
          if (!Number.isInteger(from) || !Number.isInteger(to) || from === to) return;
          const reordered = [...(window.__dockQueue || [])];
          if (!reordered.length) return;
          const [moved] = reordered.splice(from, 1);
          reordered.splice(to, 0, moved);
          socket.emit('reorder-queue', reordered);
        });
        $('queue-items').addEventListener('dragend', event => {
          event.target.closest('.item')?.classList.remove('dragging');
          document.querySelectorAll('.item.drop-target').forEach(el => el.classList.remove('drop-target'));
        });
      }
    })();
  </script>
</body>
</html>
