<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>WebDev</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #0c0c0e;
            --card: #161618;
            --card-soft: #1c1c1f;
            --accent: #ffcc00;
            --accent-soft: rgba(255, 204, 0, 0.15);
            --text: #f5f5f5;
            --dim: #555;
            --border: #2a2a2d;
        }

        body {
            background: radial-gradient(circle at top, #111 0%, #0c0c0e 60%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 14px;
            background: rgba(20, 20, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .stats-box {
            background: linear-gradient(145deg, #1a1a1c, #101012);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 55px;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
        }

        .stats-box span {
            font-size: 11px !important;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff3b30;
            animation: blink 1.2s infinite;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .btn-test {
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .btn-test:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(255, 204, 0, 0.6);
        }

        .btn-clear {
            background: #1a1a1c;
            color: #aaa;
        }

        .btn-clear:hover {
            background: #ff3b30;
            color: white;
        }

        .switch-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            background: var(--card-soft);
            padding: 5px 10px;
            border-radius: 20px;
            color: #aaa;
            border: 1px solid var(--border);
        }

        /* FEED */
        #feed {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            padding: 10px 14px;
            border-radius: 10px;
            background: linear-gradient(145deg, #18181b, #111113);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }

        .row:hover {
            transform: scale(1.01);
            border-color: var(--accent);
        }

        .avatar-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #333;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            flex: 1;
        }

        .user-name {
            font-weight: 700;
            color: #ddd;
            font-size: 12px;
        }

        .msg {
            font-size: 13px;
            color: #eee;
            margin-top: 2px;
        }

        .time {
            font-size: 9px;
            color: #666;
            position: absolute;
            right: 12px;
            top: 10px;
        }

        /* ACTIVE CHAT */
        /* Chat dalam keadaan normal (belum diklik) */
        /* Pesan baru (default) - Terang */
        /* Default: Chat sedikit buram */
        .row.CHAT {
            opacity: 0.5;
            /* Buram */
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        /* Chat yang baru masuk (Unread) - Terang */
        .row.CHAT.unread {
            opacity: 1.0;
        }

        /* Chat yang sedang aktif - Terang + Border Kuning */


        /* Pesan setelah diklik - Buram */
        .row.CHAT.read {
            opacity: 0.4;
        }

        /* Biar saat hover ke yang buram tetap terlihat jelas */
        .row.CHAT.read:hover {
            opacity: 1.0;
        }

        /* Chat saat di-hover (disentuh mouse) */
        .row.CHAT:hover {
            opacity: 1;
        }

        /* Chat saat sudah diklik (Active) */
        .row.CHAT.active {
            opacity: 1.0;
            border: 1px solid var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        .row.CHAT.active .user-name {
            color: var(--accent);
        }

        /* FOLLOW SPECIAL */
        .row.FOLLOW {
            border: 1px solid #ff0050;
            background: rgba(255, 0, 80, 0.1);
        }

        .row.FOLLOW .user-name {
            color: #ff0050;
        }

        /* INTERACTION BOX */
        #interaction-box .row {
            border: 1px solid var(--accent);
            background: rgba(255, 204, 0, 0.08);
        }

        /* SCROLL */
        #feed::-webkit-scrollbar {
            width: 5px;
        }

        #feed::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* TIMER */
        #live-timer {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            font-weight: bold;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        body {
            font-size: 12px;
        }

        /* HEADER LEBIH RAMPING */
        .header {
            padding: 10px;
        }

        .stats-container {
            gap: 8px;
        }

        .stats-box {
            padding: 2px 8px;
            min-width: 45px;
            border-radius: 14px;
        }

        .stats-box span {
            font-size: 10px !important;
        }

        /* TIMER */
        #live-timer {
            font-size: 14px !important;
        }

        /* CONTROLS */
        .controls {
            gap: 6px;
            padding-top: 8px;
        }

        .btn {
            padding: 6px 10px;
            font-size: 10px;
            border-radius: 8px;
        }

        /* SWITCH */
        .switch-group {
            padding: 3px 7px;
            font-size: 9px;
        }

        /* FEED */
        #feed {
            padding: 8px;
            gap: 5px;
        }

        /* ROW CHAT LEBIH COMPACT */
        .row {
            padding: 7px 10px;
            border-radius: 8px;
            gap: 8px;
        }

        /* AVATAR LEBIH KECIL */
        .avatar-container {
            width: 30px;
            height: 30px;
            min-width: 30px;
        }

        /* TEXT */
        .user-name {
            font-size: 10px;
        }

        .msg {
            font-size: 11px;
            line-height: 1.2;
        }

        .time {
            font-size: 8px;
            top: 6px;
            right: 8px;
        }

        /* INTERACTION BOX BIAR TIPIS */
        #interaction-box {
            padding: 6px 8px 0 8px;
        }

        /* HOVER LEBIH HALUS */
        .row:hover {
            transform: scale(1.005);
        }
    </style>
    <style>
        /* =========================================
       ANIMASI TERBANG (KEYFRAMES)
       ========================================= */
        @keyframes flyUp {
            0% {
                opacity: 0;
                transform: translate(-50%, 40px) scale(0.7);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }

            85% {
                opacity: 1;
                transform: translate(-50%, -20px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -100px) scale(0.9);
            }
        }

        /* =========================================
       BASE STYLE (ELEMEN MELAYANG COMPACT)
       ========================================= */
        .floating-gift,
        .floating-follow,
        .floating-share {
            position: fixed !important;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            z-index: 100000;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

            /* INI KUNCINYA: Mengaktifkan animasi flyUp */
            animation: flyUp 4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* --- VARIASI WARNA & POSISI --- */

        /* Gift - Pink Purple */
        .floating-gift {
            bottom: 100px;
            background: linear-gradient(135deg, #ff0050, #9000ff);
            box-shadow: 0 0 15px rgba(255, 0, 80, 0.4);
        }

        .floating-gift img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* Follow - Cyan Red (TikTok Style) */
        .floating-follow {
            bottom: 140px;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            box-shadow: 0 0 15px rgba(0, 242, 234, 0.3);
        }

        .floating-follow .icon-user {
            background: rgba(255, 255, 255, 0.2);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* Share - Golden Orange */
        .floating-share {
            bottom: 180px;
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="stats-container">
            <div class="stats-box">
                <div class="live-dot"></div>
                <span id="viewer-count" style="font-weight:800; font-size:13px;">0</span>
            </div>
            <div class="stats-box" style="border-color: rgba(255, 45, 85, 0.3);">
                <span>❤️</span>
                <span id="total-like-count" style="font-weight:800; font-size:13px; color: #ff2d55;">0</span>
            </div>
            <div class="stats-box" style="border-color: rgba(0, 229, 255, 0.3);">
                <span>🌐</span>
                <span id="total-sebaran" style="font-weight:800; font-size:13px; color: var(--accent);">0</span>
            </div>
            <div class="stats-box" style="border-color: rgba(255, 0, 80, 0.3);">
                <span>✅</span>
                <span id="total-follower-count" style="font-weight:800; font-size:13px; color: #ff0050;">0</span>
            </div>
            <div class="duration-container"
                style="text-align: center; padding: 5px 0; border-top: 1px solid #222; background: rgba(0,0,0,0.2);">
                <span style="font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px;">Durasi
                    Live</span>
                <div id="live-timer"
                    style="font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px var(--accent);">
                    00:00:00</div>
            </div>
        </div>

        <div class="controls">
            <!-- Tombol Chat (Icon Pesan) -->
            <button class="btn btn-test" onclick="sendTestChat()" title="Chat">
                <i class="fas fa-paper-plane"></i>
            </button>

            <!-- Tombol Hapus (Icon Tong Sampah) -->
            <button class="btn btn-clear" onclick="document.getElementById('feed').innerHTML=''" title="Hapus">
                <i class="fas fa-trash-alt"></i>
            </button>
            <div class="switch-group"><input type="checkbox" id="autoPost"> <span>AUTO</span></div>
            <div class="switch-group"><input type="checkbox" id="ttsOn"> <span>🎙️</span></div>
            <div class="switch-group" style="gap: 5px;">
                <input type="checkbox" id="soundOn" checked>
                <span>🔊</span>
                <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.6"
                    style="width: 50px; cursor: pointer; accent-color: var(--accent);">
            </div>
            <div class="switch-group">
                <span>🔔</span>
                <select id="soundSelect" style="
                        background: transparent;
                        border: none;
                        color: #aaa;
                        font-size: 9px;
                        outline: none;
                        cursor: pointer;
                    ">
                    <option value="notif6">Default</option>
                    <option value="notif1">Kristal tabure</option>
                    <option value="notif2">Kristal</option>
                    <option value="notif3">Subtle Notification</option>
                    <option value="notif4">Click</option>
                    <option value="notif5">Smooth</option>
                    <option value="notif7">Modern & Clean</option>
                    <option value="notif8">Soft Bubble</option>
                    <option value="notif9">Alert Pop</option>
                    <option value="notif10">Bright & Happy</option>
                    <option value="notif11">Energetic Chime</option>
                    <option value="notif12">Success Sparkle</option>
                    <option value="notif13">Positive Alert</option>
                    <option value="notif14">Achievement Sound</option>
                    <option value="notif15">Upbeat Digital</option>
                </select>
            </div>
        </div>

    </div>

    <div id="interaction-box" style="padding: 10px 10px 0 10px;"></div>

    <div id="feed"></div>

    <script>
        let lastOverlay = 0;
        const socket = io();

        document.getElementById("autoPost").addEventListener("change", () => {

            document.querySelectorAll('.row.CHAT.active')
                .forEach(el => el.classList.remove('active'));

        });
        let newFollowerCount = 0;
        const soundList = {
            notif1: 'https://assets.mixkit.co/active_storage/sfx/1109/1109-preview.mp3', // default
            notif2: 'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3', // Kristal
            notif3: 'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3', // Subtle Notification
            notif4: 'https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3', // click
            notif5: 'https://assets.mixkit.co/active_storage/sfx/1114/1114-preview.mp3', //Smooth
            notif6: 'https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3', //Kristal tabure
            notif7: 'https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3', //Modern & Clean
            notif8: 'https://assets.mixkit.co/active_storage/sfx/2359/2359-preview.mp3', //Soft Bubble
            notif9: 'https://assets.mixkit.co/active_storage/sfx/1110/1110-preview.mp3', //Alert Pop
            notif10: 'https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3', //Bright & Happy
            notif11: 'https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3', //Energetic Chime
            notif12: 'https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3', //Success Sparkle
            notif13: 'https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3', //Positive Alert
            notif14: 'https://assets.mixkit.co/active_storage/sfx/2014/2014-preview.mp3', //Achievement Sound
            notif15: 'https://assets.mixkit.co/active_storage/sfx/2015/2015-preview.mp3' //Upbeat Digital
        };

        let currentSound = soundList.notif1;

        const audio = new Audio(currentSound);
        const volSlider = document.getElementById('volumeControl');

        // Set volume awal dari slider
        audio.volume = volSlider.value;

        // Update volume tiap kali slider digeser
        volSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            console.log("Volume Notif:", Math.round(e.target.value * 100) + "%");
        });
        const soundSelect = document.getElementById('soundSelect');

        soundSelect.addEventListener('change', (e) => {
            currentSound = soundList[e.target.value];
            audio.src = currentSound;

            console.log("Sound diganti:", e.target.value);
        });

        let voices = [];

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            // Log ini akan muncul di F12 (Console), cek suara apa saja yang terdeteksi
            if (voices.length > 0) {
                const indo = voices.filter(v => v.lang.includes('id') || v.name.toLowerCase().includes('indonesia'));
                console.log("Daftar suara Indo yang ditemukan:", indo.map(v => v.name));
            }
        }

        // Panggil saat startup dan saat daftar suara berubah
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // GANTI SEMUA FUNGSI speakChat LAMA DENGAN INI
        function speakChat(name, message) {
            const isTTS = document.getElementById('ttsOn').checked;
            if (!isTTS) return;

            const cleanMsg = message.replace(/[^\w\s]/gi, '');
            const textToSpeak = `${name} bilang: ${cleanMsg}`;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);

            // Ambil volume langsung dari slider agar sinkron
            const vol = document.getElementById('volumeControl').value;
            utterance.volume = vol;

            // Cari suara Indonesia
            if (voices.length === 0) voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.lang.includes('id') || v.name.toLowerCase().includes('indonesia'));

            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = 'id-ID';
            }

            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            window.speechSynthesis.cancel(); // Anti antre panjang
            window.speechSynthesis.speak(utterance);
        }

        // TRIK KHUSUS: Pancing daftar suara saat startup
        // Beberapa browser butuh ini agar getVoices() tidak kosong
        window.speechSynthesis.getVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
                console.log("Voices loaded.");
            };
        }

        function sendTestChat() {
            const dummyData = {
                user: "Partner_Brow",
                nickname: "Webdev Broadcast 🔥",
                message: "Overlay aktif. Foto ganteng sudah muncul? GGWP!",
                profilePictureUrl: "/coba.png",
                isTest: true
            };

            addActivity('CHAT', dummyData);

            const isAuto = document.getElementById('autoPost').checked;

            if (isAuto) {
                socket.emit('send-to-overlay', dummyData);
            }
        }


        // Fungsi untuk merubah 1000 jadi 1K, dst.
        function formatK(num) {
            return num >= 1000 ? (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : num;
        }
        // --- LOGIKA UPDATE TOTAL SEBARAN (UNIQUE USERS) ---
        socket.on('update-sebaran', (data) => {
            const el = document.getElementById('total-sebaran');
            if (el) el.innerText = formatK(data.total || 0); // Pakai formatK
        });

        socket.on('update-viewer-count', d => {
            const el = document.getElementById('viewer-count');
            if (el) {
                const count = (typeof d === 'object' && d !== null) ? d.count : d;
                el.innerText = formatK(count || 0); // Pakai formatK
            }
        });

        socket.off('like-stats').on('like-stats', (data) => {

            const el = document.getElementById('total-like-count');

            if (el) {
                el.innerText = formatK(data.totalLikeCount || 0);
            }

        });

        socket.on('update-follower-count', (data) => {
            const el = document.getElementById('total-follower-count');
            if (el) el.innerText = formatK(data.total || 0); // Pakai formatK
        });

        function addActivity(type, data) {
            const isAuto = document.getElementById('autoPost').checked;
            const feed = document.getElementById('feed');
            const interactionBox = document.getElementById('interaction-box');
            const profilePic = data.profilePictureUrl || data.profilePic || 'https://www.w3schools.com/howto/img_avatar.png';

            // 1. Logika Interaction Box (Gift/Follow/Join)
            if (type !== 'CHAT') {
                interactionBox.innerHTML = `
        <div class="row ${type}" style="border-left: 4px solid var(--accent); margin-bottom: 5px; display: flex; align-items: center; padding: 5px;">
            <img src="${profilePic}" style="width:30px; height:30px; border-radius:50%; margin-right:10px;">
            <div class="content">
                <div class="user-name" style="font-size:12px; font-weight:bold;">${data.nickname || data.uniqueId}</div>
                <div class="msg" style="font-size:11px; color:var(--accent)">${data.message}</div>
            </div>
        </div>`;
                return;
            }

            // 2. Logika Chat
            // ... di dalam fungsi addActivity ...

            // 2. Logika Chat
            const div = document.createElement('div');
            // Awalnya beri class 'unread' (terang)
            div.className = `row CHAT unread`;
            div.style.cursor = 'pointer';

            // --- BAGIAN LOGIKA KLIK MANUAL ---
            div.onclick = function () {
                // 1. Ambil semua chat yang saat ini statusnya 'active' 
                //    dan ubah jadi 'read' (buram) agar border kuningnya hilang
                document.querySelectorAll('.row.CHAT.active').forEach(el => {
                    el.classList.remove('active');
                    el.classList.add('read');
                });

                // 2. Tandai chat yang baru diklik sebagai 'active'
                //    Hapus 'unread' (karena sekarang sudah diklik)
                div.classList.remove('unread', 'read');
                div.classList.add('active');

                // 3. Kirim ke overlay
                socket.emit('send-to-overlay', { ...data, profilePictureUrl: profilePic });
            };

            // Pastikan CSS Anda mendukung class .unread (opacity 1) dan .read (opacity 0.4)
            // ---------------------------------------

            // Kirim ke overlay OTOMATIS jika Auto Post aktif
            if (isAuto) {
                document.querySelectorAll('.row.CHAT.active').forEach(el => el.classList.remove('active'));
                socket.emit('send-to-overlay', { ...data, profilePictureUrl: profilePic });
            }

            div.innerHTML = `
            <div class="avatar-container"><img src="${profilePic}" class="avatar-img"></div>
            <div class="content">
                <span class="time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                <div class="user-name">${data.nickname || data.uniqueId}</div>
                <div class="msg">${data.message}</div>
            </div>`;

            // 3. Jalankan TTS & Suara Notif
            speakChat(data.nickname || data.uniqueId, data.message);

            if (document.getElementById('soundOn').checked) {
                audio.currentTime = 0;
                audio.play().catch(() => { });
            }

            feed.prepend(div);
            if (feed.children.length > 30) feed.lastChild.remove();
        }

        socket.off('new-chat-monitor').on('new-chat-monitor', d => addActivity('CHAT', d));

        socket.off('new-gift-monitor').on('new-gift-monitor', d => {
            console.log("Gift masuk:", d); // CEK DI CONSOLE F12, DATA MUNCUL GAK?

            // Ambil nickname atau uniqueId (username)
            const pemanggil = d.nickname || d.uniqueId || "User";

            // Panggil animasi
            showFloatingGift(pemanggil, d.giftName, d.count);

            // Masukkan ke log aktivitas bawah
            addActivity('GIFT', { ...d, message: `🎁 Mengirim ${d.giftName} x${d.count}` });
        });

        socket.off('new-social-monitor').on('new-social-monitor', d => {
            let msg = `👤 Melakukan ${d.type.toLowerCase()}`;
            if (d.type === 'LIKE') msg = `❤️ Tap-tap layar`;
            if (d.type === 'SHARE') {
                msg = `🔗 Membagikan Live`;
                showFloatingShare(d.nickname || d.uniqueId); // Panggil animasi melayang
            }
            if (d.type === 'FOLLOW') {
                msg = `✅ Mulai mengikuti Anda!`;
                newFollowerCount++;
                const followerEl = document.getElementById('total-follower-count');
                if (followerEl) {
                    followerEl.innerText = newFollowerCount.toLocaleString('id-ID');
                }
            }
            addActivity(d.type, { ...d, message: msg });
        });
        socket.off('new-join-monitor').on('new-join-monitor', d => addActivity('JOIN', { ...d, message: '🚪 Bergabung ke Live' }));
        // Handler Status & Timer
        socket.off('tiktok-connected').on('tiktok-connected', (data) => {
            if (data && data.startTime) startLiveTimer(data.startTime);
        });

        socket.off('status').on('status', (msg) => {
            const statusEl = document.getElementById('status-text');
            if (statusEl) {
                statusEl.innerText = msg;
                statusEl.style.color = msg.includes('Mencoba') ? '#ffaa00' : (msg.includes('Tersambung') ? '#00ff00' : '#ff0000');
            }
        });

        socket.off('tiktok-disconnected').on('tiktok-disconnected', () => stopLiveTimer());



        let startTime = null;
        let timerInterval = null;

        function startLiveTimer(serverStartTime) {
            if (timerInterval) clearInterval(timerInterval);

            // Pastikan serverStartTime ada isinya dan berupa angka
            if (!serverStartTime || isNaN(serverStartTime)) {
                console.error("Waktu mulai dari server tidak valid!");
                return;
            }

            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = Math.floor((now - serverStartTime) / 1000);

                // Jika hasil selisih negatif (karena perbedaan jam sistem), set ke 0
                const totalSeconds = Math.max(0, diff);

                const hours = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                const seconds = (totalSeconds % 60).toString().padStart(2, '0');

                const el = document.getElementById('live-timer');
                if (el) {
                    el.innerText = `${hours}:${minutes}:${seconds}`;
                }
            }, 1000);
        }
        function stopLiveTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            startTime = null;
            const el = document.getElementById('live-timer');
            if (el) el.innerText = "00:00:00";
        }

        //--------------------------------------------------------------------------------------------------------------------------------------------------
        // ==========================================
        // 1. FUNGSI-FUNGSI ANIMASI MELAYANG
        // ==========================================

        // Fungsi melayang untuk GIFT
        function showFloatingGift(nickname, giftName, count, giftIcon) {
            const floatDiv = document.createElement('div');
            floatDiv.className = 'floating-gift';

            // Posisi random horizontal (30% - 70%) biar gak tumpuk
            const randomLeft = Math.floor(Math.random() * (70 - 30 + 1)) + 30;
            floatDiv.style.left = randomLeft + '%';

            const iconHtml = giftIcon
                ? `<img src="${giftIcon}" alt="gift">`
                : `<span style="font-size:24px;">🎁</span>`;

            floatDiv.innerHTML = `
        ${iconHtml}
        <span><b>${nickname}</b> mengirim <b>${giftName} x${count}</b></span>
    `;

            document.body.appendChild(floatDiv);
            setTimeout(() => floatDiv.remove(), 4000);
        }

        // Fungsi melayang untuk FOLLOW
        function showFloatingFollow(nickname) {
            const floatDiv = document.createElement('div');
            floatDiv.className = 'floating-follow';

            // Posisi random (35% - 65%)
            const randomLeft = Math.floor(Math.random() * (65 - 35 + 1)) + 35;
            floatDiv.style.left = randomLeft + '%';
            floatDiv.style.bottom = '150px'; // Biar beda lantai sama gift
            floatDiv.style.zIndex = '100001';

            floatDiv.innerHTML = `
        <div class="icon-user"><i class="fas fa-user-plus"></i></div>
        <span><b>${nickname}</b> Menjadi Pengikut! ✨</span>
    `;

            document.body.appendChild(floatDiv);
            setTimeout(() => floatDiv.remove(), 4000);
        }

        // Fungsi melayang untuk SHARE
        function showFloatingShare(nickname) {
            const floatDiv = document.createElement('div');
            floatDiv.className = 'floating-share';
            floatDiv.style.position = 'fixed';
            floatDiv.style.zIndex = '9999';

            const randomLeft = Math.floor(Math.random() * (60 - 40 + 1)) + 40;
            floatDiv.style.left = randomLeft + '%';

            floatDiv.innerHTML = `
        <i class="fas fa-share-nodes"></i>
        <span>${nickname} Membagikan Live! 🔥</span>
    `;
            document.body.appendChild(floatDiv);
            setTimeout(() => floatDiv.remove(), 5000);
        }

        // Tambahkan listener untuk tombol Enter agar lebih mudah
        document.getElementById('tiktok-chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendTikTokChat();
            }
        });

        // ==========================================
        // 2. SOCKET LISTENERS (Penerima Data dari Server)
        // ==========================================

        // Tangkap GIFT
        socket.on('new-gift', (d) => {
            console.log("🎁 Gift:", d);
            showFloatingGift(d.nickname || d.user, d.giftName, d.count, d.giftIcon);

            // Masuk ke daftar aktivitas samping
            addActivity('GIFT', {
                nickname: d.nickname || d.user,
                message: `🎁 Mengirim ${d.giftName} x${d.count}`,
                profilePic: d.giftIcon || 'https://www.w3schools.com/howto/img_avatar.png'
            });
        });

        // Tangkap FOLLOW
        socket.on('new-follower', (d) => {
            console.log("👤 Follow:", d);
            showFloatingFollow(d.nickname || d.user);

            addActivity('FOLLOW', {
                nickname: d.nickname || d.user,
                message: `👤 Baru saja mengikuti!`,
                profilePic: d.profilePictureUrl || 'https://www.w3schools.com/howto/img_avatar.png'
            });
        });

        // Tangkap SHARE
        socket.on('new-share', (d) => {
            console.log("🔗 Share:", d);
            showFloatingShare(d.nickname || d.user);

            addActivity('SHARE', {
                nickname: d.nickname || d.user,
                message: `🔗 Membagikan live ini!`,
                profilePic: d.profilePictureUrl || 'https://www.w3schools.com/howto/img_avatar.png'
            });
        });

        // Tangkap CHAT (Biar dashboard tetap update chat-nya)
        socket.on('new-chat', (d) => {
            addActivity('CHAT', {
                nickname: d.nickname || d.user,
                message: d.comment,
                profilePic: d.profilePictureUrl
            });
        });



        //-------------------------------------------------------------------------------------------------------------------------------------------------

        // 1. Jalankan saat server bilang sukses konek pertama kali
        window.onload = () => {

            loadVoices();
            socket.emit('get-status');

            console.log("Monitoring aktif, sinkronisasi sistem...");

        };
    </script>
