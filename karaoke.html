<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDev Live Karaoke Player</title>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            /* Nuansa background dirubah ke gradient mewah sesuai halaman index */
            background: linear-gradient(135deg, #090a0f 0%, #0f111a 50%, #18122b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .karaoke-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            /* Efek Glassmorphic premium dengan border tipis menyala */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.02);
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .header-info h3 {
            margin: 0;
            /* Warna teks gradasi gold pink menyala khas WebDev Stream Sync */
            background: linear-gradient(45deg, #ffb300, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #songTitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 🌟 LAPISAN GAIB PENAHAN KURSOR */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10; /* Menimpa iframe youtube di bawahnya */
            cursor: default;
        }

        /* Memaksa iframe youtube memenuhi kontainer secara responsif */
        #karaokePlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="karaoke-container">
        <div class="header-info">
            <h3>🎤 LIVE KARAOKE PLAYER</h3>
            <div id="songTitle">Menunggu lagu karaoke...</div>
        </div>

        <div class="video-wrapper">
            <div class="video-overlay"></div>
            
            <div id="karaokePlayer"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 🌟 Hapus menu File, Edit, View langsung dari sisi frontend Electron
        try {
            const { require } = window;
            if (require) {
                const { remote } = require('electron');
                const currentWindow = remote?.getCurrentWindow() || window.nw?.Window?.get();
                if (currentWindow) {
                    currentWindow.setMenuBarVisibility(false);
                }
            }
        } catch (e) {
            console.log("Menjalankan di browser biasa");
        }

        const socket = io("http://localhost:3000");
        const songTitleDiv = document.getElementById("songTitle");
        
        let player;
        let currentVideoId = null;
        let currentSongId = null;

        // 1. Inisialisasi Player YouTube bawaan Google
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('karaokePlayer', {
                videoId: '', 
                playerVars: {
                    autoplay: 1,
                    controls: 0,       // 🌟 MATIKAN KONTROL TOTAL BIAR BERSIH SEMPURNA
                    disablekb: 1,      // Matikan input spasi/keyboard biar ga sengaja ke-pause
                    rel: 0,
                    modestbranding: 1
                },
                events: {
                    onReady: onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Player Karaoke siap gas!");
            if (event.target && typeof event.target.unMute === 'function') {
                event.target.unMute();
            }
        }

        // 2. Dengarkan update lagu dari server
        socket.on("update-queue", (data) => {
            const song = data.currentSong;

            if (!song) {
                songTitleDiv.innerText = "Daftar putar kosong.";
                if (player && typeof player.stopVideo === 'function') {
                    player.stopVideo();
                }
                currentVideoId = null;
                currentSongId = null;
                return;
            }

            // Jika lagu berganti, langsung load video youtube baru ke player khusus karaoke ini
            if (song.youtubeId && currentSongId !== song.id) {
                currentSongId = song.id;
                currentVideoId = song.youtubeId;
                
                songTitleDiv.innerText = `Muter: ${song.title} (${song.requestedBy})`;

                // Masukkan ID video YouTube-nya langsung ke pemutar karaoke
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(currentVideoId);
                    
                    // Jaminan extra: Setiap ganti track, paksa un-mute biar suaranya langsung loss keluar
                    setTimeout(() => {
                        if (player && typeof player.unMute === 'function') {
                            player.unMute();
                        }
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
