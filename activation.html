<!DOCTYPE html>
<html>

<head>
    <title>WebDev</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            background:
                radial-gradient(circle at top left,
                    rgba(0, 242, 255, .12),
                    transparent 35%),

                radial-gradient(circle at bottom right,
                    rgba(168, 85, 247, .12),
                    transparent 35%),

                linear-gradient(135deg,
                    #090b10,
                    #0f1118,
                    #111827);

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 100vh;
            margin: 0;
            overflow: hidden;

            -webkit-app-region: drag;
            position: relative;
        }

        /* GRID BACKGROUND */

        body::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(rgba(0, 242, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, .05) 1px, transparent 1px);

            background-size: 40px 40px;

            pointer-events: none;
        }

        /* GLOW AMBIENT */

        body::after {
            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(circle,
                    rgba(0, 242, 255, .08),
                    transparent 70%);

            pointer-events: none;
        }

        /* ANIMASI */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CONTAINER */

        .container {

            position: relative;
            z-index: 2;

            width: 400px;

            padding: 40px 35px;

            border-radius: 28px;

            background:
                linear-gradient(135deg,
                    rgba(30, 41, 59, .88),
                    rgba(17, 24, 39, .92),
                    rgba(15, 23, 42, .95));

            border: 1px solid rgba(255, 255, 255, .08);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 80px rgba(0, 0, 0, .65),
                0 0 40px rgba(0, 242, 255, .08);

            text-align: center;

            animation: fadeIn .7s ease;
        }

        /* TOP GLOW */

        .container::before {

            content: "";

            position: absolute;

            left: 50%;
            top: 0;

            transform: translateX(-50%);

            width: 140px;
            height: 3px;

            border-radius: 999px;

            background:
                linear-gradient(90deg,
                    #00f2ff,
                    #8b5cf6,
                    #ec4899);

            box-shadow:
                0 0 20px rgba(0, 242, 255, .8),
                0 0 35px rgba(139, 92, 246, .5);
        }

        /* AVATAR */

        .profile-img {

            width: 95px;
            height: 95px;

            object-fit: cover;

            border-radius: 50%;

            margin-top: 20px;
            /* Geser ke bawah */
            margin-bottom: 18px;

            border: 3px solid rgba(255, 255, 255, .1);

            background: linear-gradient(135deg,
                    #00f2ff,
                    #8b5cf6,
                    #ec4899);

            padding: 2px;

            box-shadow: 0 0 30px rgba(0, 242, 255, .25);

            transition: .3s;
        }

        .profile-img:hover {
            transform: translateY(20px) scale(1.05);
        }

        /* TITLE */

        h2 {

            margin: 0 0 10px;

            font-size: 26px;
            font-weight: 800;

            background:
                linear-gradient(90deg,
                    #00f2ff,
                    #8b5cf6,
                    #ec4899);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            letter-spacing: 1px;
        }

        /* DESC */

        p {

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 24px;
        }

        /* INPUT */

        .input-group {

            margin-bottom: 22px;

            position: relative;

            -webkit-app-region: no-drag;
        }

        input {

            width: 100%;

            padding: 16px;

            box-sizing: border-box;

            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, .08);

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, .04),
                    rgba(255, 255, 255, .02));

            color: #fff;

            text-align: center;

            font-size: 16px;

            font-family: 'Courier New', monospace;

            letter-spacing: 2px;

            outline: none;

            transition: .3s;
        }

        input:focus {

            border-color: #00f2ff;

            box-shadow:
                0 0 0 3px rgba(0, 242, 255, .12),
                0 0 25px rgba(0, 242, 255, .12);
        }

        /* BTN LOGIN */

        button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 14px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 800;

            color: #fff;

            letter-spacing: 1px;

            text-transform: uppercase;

            background:
                linear-gradient(135deg,
                    #00f2ff,
                    #8b5cf6,
                    #ec4899);

            box-shadow:
                0 10px 30px rgba(0, 242, 255, .15);

            transition: .3s;

            -webkit-app-region: no-drag;
        }

        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 40px rgba(0, 242, 255, .25);
        }

        /* BTN BELI */

        .btn-buy {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            text-decoration: none;

            border-radius: 14px;

            font-weight: 700;

            color: #fff;

            border: 1px solid rgba(255, 255, 255, .08);

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .02));

            transition: .3s;

            box-sizing: border-box;

            -webkit-app-region: no-drag;
        }

        .btn-buy:hover {

            transform: translateY(-3px);

            border-color: #00f2ff;

            box-shadow:
                0 0 25px rgba(0, 242, 255, .15);
        }

        /* STATUS */

        #status-msg {

            min-height: 20px;

            margin-top: 18px;

            color: #f87171;

            font-size: 13px;

            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="coba.png" class="profile-img" alt="Profile">

        <h2>WebDev Stream Overlay</h2>

        <p>
            Masukkan kode lisensi resmi.<br>
            Beli lisensi dengan mudah melalui WhatsApp.
        </p>

        <div class="input-group">
            <input type="text" id="license-input" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false">
        </div>

        <button onclick="submitLicense()" id="btn-activate">
            Verify License
        </button>

        <!-- Tombol Beli Lisensi -->
        <a href="https://wa.me/6281343901082?text=Halo%20saya%20ingin%20membeli%20lisensi%20WebDev%20Stream"
            class="btn-buy" target="_blank" id="buy-license">
            🔑 Dapatkan Lisensi Resmi
        </a>

        <div id="status-msg"></div>

    </div>

    <script>
        const { ipcRenderer, shell } = require('electron');

        document.addEventListener('DOMContentLoaded', () => {
            const buyBtn = document.getElementById('buy-license');

            if (buyBtn) {
                buyBtn.addEventListener('click', (e) => {
                    e.preventDefault();

                    shell.openExternal(
                        'https://wa.me/6281343901082?text=Halo%20Admin,%20saya%20ingin%20membeli%20lisensi%20WebDev%20Stream.'
                    );
                });
            }
        });

        function submitLicense() {
            const key = document.getElementById('license-input').value.trim();
            const btn = document.getElementById('btn-activate');
            const msg = document.getElementById('status-msg');

            if (!key) {
                msg.style.color = "#ff4757";
                msg.innerText = "KODE LISENSI HARUS DIISI!";
                return;
            }

            btn.innerText = "VERIFYING SYSTEM...";
            btn.disabled = true;
            ipcRenderer.send('check-license', key);
        }

        ipcRenderer.on('license-status', (event, response) => {
            const btn = document.getElementById('btn-activate');
            const msg = document.getElementById('status-msg');

            if (response.success) {
                msg.style.color = "#2ed573";
                msg.innerText = "ACCESS GRANTED! REDIRECTING...";
                setTimeout(() => {
                    // StartApp ditangani di main.js
                }, 500);
            } else {
                btn.innerText = "VERIFY LICENSE";
                btn.disabled = false;
                msg.style.color = "#ff4757";
                msg.innerText = response.message;
            }
        });
    </script>
</body>

</html>
