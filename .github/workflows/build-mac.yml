name: Build Mac Cepat
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cek File dan Ekstrak
        run: |
          ls -R # Biar kita liat di log file apa aja yang ada
          unzip -o build.zip -d . || echo "Build zip tidak ditemukan atau gagal"
          unzip -o themes.zip -d . || echo "Themes zip tidak ditemukan atau gagal"
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Kita naikin ke versi 20 biar nggak kena warning
          
      - name: Install dan Build
        run: |
          npm install
          npx electron-builder --mac --config.mac.identity=null # Tambahin ini biar nggak minta sertifikat Apple
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
