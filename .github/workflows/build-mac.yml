name: Build Mac Cepat
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Ekstrak File
        run: |
          unzip -o build.zip -d . || echo "build.zip tidak ada"
          unzip -o themes.zip -d . || echo "themes.zip tidak ada"
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install
          
      - name: Build DMG
        run: |
          # Perintah ini lebih aman, tanpa embel-embel 'null' yang bikin error tadi
          npx electron-builder --mac dmg -c.mac.identity=null
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
