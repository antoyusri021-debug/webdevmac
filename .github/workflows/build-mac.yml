name: Build Mac Cepat
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Ekstrak File
        run: |
          unzip -o build.zip -d . || echo "build.zip tidak ada"
          unzip -o themes.zip -d . || echo "themes.zip tidak ada"
          unzip -o css.zip -d . || echo "css.zip tidak ada"
          
      - uses: actions/setup-node@v4
        with:
          # Diperbarui ke versi 24 untuk menghilangkan peringatan deprecated
          node-version: 24
          
      - name: Install Dependencies
        run: npm install
          
      - name: Build DMG
        run: |
          # Kita tambahin flag --publish never biar dia nggak minta token GitHub
          npx electron-builder --mac dmg -c.mac.identity=null --publish never
      
      - name: Simpan Installer
        uses: actions/upload-artifact@v4
        with:
          name: WebDev-Mac-Installer
          path: dist/*.dmg
