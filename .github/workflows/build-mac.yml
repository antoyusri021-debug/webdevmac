name: Build macOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Bersihkan cache runner dan cek ruang disk
        shell: bash
        run: |
          set -euo pipefail

          echo "Ruang disk sebelum pembersihan:"
          df -h /

          # Membersihkan cache yang tidak diperlukan untuk build aplikasi.
          # Folder yang tidak ada akan dilewati.
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"
          rm -rf "$HOME/Library/Caches/CocoaPods"
          rm -rf "$HOME/Library/Caches/Homebrew"
          rm -rf "$HOME/Library/Caches/pip"
          rm -rf "$HOME/.npm/_cacache"
          rm -rf "$HOME/.cache"

          echo "Ruang disk setelah pembersihan:"
          df -h /

      - name: Ekstrak ZIP wajib satu per satu
        shell: bash
        run: |
          set -euo pipefail

          archives=(build.zip themes.zip css.zip js.zip tools.zip)

          for archive in "${archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "::error::File ZIP wajib tidak ditemukan: $archive"
              exit 1
            fi

            echo "Memeriksa arsip: $archive"
            unzip -tq "$archive"

            echo "Mengekstrak: $archive"
            unzip -oq "$archive" -d .

            echo "Menghapus arsip setelah berhasil diekstrak: $archive"
            rm "$archive"

            echo "Ruang disk setelah memproses $archive:"
            df -h /
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Aplikasi macOS (DMG - Intel & ARM64)
        run: npm run dist -- --mac --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: v1.0.${{ github.run_number }}
          name: Build macOS v1.0.${{ github.run_number }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
