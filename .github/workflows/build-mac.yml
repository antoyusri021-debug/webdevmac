name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Cek File Sebelum Ekstrak
        run: ls -la

      - name: Ekstrak File ZIP Otomatis
        # Kode *.zip ini akan otomatis mencari file ZIP apa saja yang kamu upload dan mengekstraknya
        run: unzip -o *.zip -d .

      - name: Cek File Setelah Ekstrak
        # Ini untuk memastikan package.json benar-benar ada di luar setelah di-unzip
        run: ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Aplikasi macOS (DMG)
        run: npm run dist -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Hasil Build (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: WebDev-Sync-macOS
          path: dist/*.dmg
          retention-days: 7
