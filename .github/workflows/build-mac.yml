name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak Folder ZIP
        # Mengekstrak masing-masing folder satu per satu secara berurutan
        run: |
          unzip -o build.zip -d .
          unzip -o themes.zip -d .
          unzip -o css.zip -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Aplikasi macOS (DMG)
        run: npm run dist -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Hasil Build (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: WebDev-Sync-macOS
          path: dist/*.dmg
          retention-days: 7
