name: Build macOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Periksa file dan folder aplikasi
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            package.json \
            package-lock.json \
            build \
            themes \
            css \
            js \
            tools
          do
            if [[ ! -e "$path" ]]; then
              echo "::error::File atau folder wajib tidak ditemukan di root repo: $path"
              exit 1
            fi
          done

          echo "File dan folder aplikasi ditemukan."
          echo "Ruang disk sebelum install/build:"
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Aplikasi macOS (DMG - Intel & ARM64)
        run: npm run dist -- --mac --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Periksa hasil DMG
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "dist/*.dmg" > /dev/null; then
            echo "::error::File DMG tidak ditemukan di folder dist."
            echo "Isi folder dist:"
            ls -lah dist/ || true
            exit 1
          fi

          ls -lah dist/*.dmg

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: v1.0.${{ github.run_number }}
          name: Build macOS v1.0.${{ github.run_number }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
