name: Build macOS App

on:
  push:
    branches: [ main, master ] # Akan otomatis build kalau kamu push ke branch ini
  workflow_dispatch: # Bikin tombol manual buat nge-trigger build

jobs:
  build-mac:
    runs-on: macos-latest # Kita pinjam komputer Mac dari GitHub

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      # --- INI BAGIAN YANG DITAMBAHKAN ---
      - name: Ekstrak File ZIP
        # GANTI 'source.zip' DENGAN NAMA FILE ZIP YANG KAMU UPLOAD DI GITHUB
        run: unzip -o source.zip -d .
      # -----------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Bisa disesuaikan dengan versi Node.js kamu

      - name: Install Dependencies
        run: npm install

      - name: Build Aplikasi macOS (DMG)
        run: npm run dist -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Hasil Build (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: WebDev-Sync-macOS
          path: dist/*.dmg
          retention-days: 7
