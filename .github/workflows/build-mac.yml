name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write # Wajib ada agar sistem bisa membuat Release

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak Folder ZIP
        run: |
          unzip -o build.zip -d .
          unzip -o themes.zip -d .
          unzip -o css.zip -d .
          unzip -o js.zip -d .
          unzip -o tools.zip -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Aplikasi macOS (DMG - Intel & ARM64)
        run: npm run dist -- --mac --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Mengunggah hasil build langsung ke GitHub Releases
      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: v1.0.${{ github.run_number }}
          name: Build macOS v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
