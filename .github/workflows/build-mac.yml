name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    # Izin penting agar GitHub Actions bisa menulis/membuat rilis di repository
    permissions:
      contents: write

    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak Folder ZIP
        # Menggunakan Python agar proses ekstraksi 5 file zip aman dari error atribut/karakter khusus
        run: |
          python3 -c "
          import zipfile
          import os

          zip_files = ['build.zip', 'themes.zip', 'css.zip', 'js.zip', 'tools.zip']
          for zf in zip_files:
              if os.path.exists(zf):
                  print(f'Mengekstrak {zf}...')
                  with zipfile.ZipFile(zf, 'r') as zip_ref:
                      for file_info in zip_ref.infolist():
                          try:
                              zip_ref.extract(file_info, '.')
                          except Exception as e:
                              print(f'Peringatan pada file {file_info.filename}: {e}')
              else:
                  print(f'File {zf} tidak ditemukan, melewati...')
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        # Menggunakan --legacy-peer-deps agar instalasi library tidak bentrok/error di server
        run: npm install --legacy-peer-deps

      - name: Build Aplikasi macOS (DMG)
        # CSC_IDENTITY_AUTO_DISCOVERY: false wajib dipasang biar build sukses tanpa akun Apple Developer $99/tahun
        run: npm run dist -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Hasil Build (.dmg) ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebDev-Sync-macOS
          path: dist/*.dmg
          retention-days: 7

      - name: Rilis Otomatis ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: v1.0.${{ github.run_number }}
          name: "Aplikasi macOS v1.0.${{ github.run_number }}"
          body: "Rilis otomatis aplikasi macOS dari GitHub Actions build #${{ github.run_number }}."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
