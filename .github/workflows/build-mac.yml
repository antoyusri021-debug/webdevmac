name: Build Mac Cepat
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Ekstrak dan Debug
        run: |
          unzip -o build.zip -d . || echo "build.zip fail"
          unzip -o themes.zip -d . || echo "themes.zip fail"
          echo "--- STRUKTUR FILE SEKARANG ---"
          ls -R
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dan Build
        run: |
          npm install
          # Kita pakai npx electron-builder langsung dengan flag ignore-errors
          npx electron-builder --mac --config.mac.identity=null --config.afterPack=null
      
      - name: Upload Installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
